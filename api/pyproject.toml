[project]
name = "tallyquo"
version = "0.1.0"
description = "Invoicing and financial record-keeping for Canadian sole proprietors"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "boto3>=1.35",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "cryptography>=43.0",
    "reportlab>=4.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tallyquo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
